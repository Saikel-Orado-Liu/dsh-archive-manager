name: publish.yml

# Publishes the tagged commit, derives the npm dist-tag from the package's DSH
# peer ranges, then reconciles every tag.
#
# The dist-tag is not derived from the version string alone. DSH ships two
# release lines at once: @deepseek-ai/dsh names the current one under "latest"
# and the upcoming one under "next", and a plugin version only runs on the line
# its @deepseek-ai/dsh* peer ranges accept. scripts/dist-tag.mjs reads those
# ranges, reads the DSH lines from the registry, and picks latest, next, or
# alpha - the same judgement the runtime gate makes before it loads a bundle.
# The community market installs the bare package name, i.e. whatever "latest"
# names, so this choice decides whether a visitor's runtime accepts the build
# the market just installed.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check if version is already published
        id: check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@gamegeek-saikel/dsh-archive-manager@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version $PKG_VERSION already published; skipping publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.skip != 'true'
        run: |
          TAG=$(node scripts/dist-tag.mjs resolve)
          echo "publishing with dist-tag $TAG"
          npm publish --provenance --access public --tag "$TAG"

      # Repairs tags an earlier release left wrong by re-pointing each one at the
      # newest version that supports it. Deliberately advisory: the --tag above
      # already tagged the version being released, and npm's trusted-publishing
      # credential carries publish scope only, so it is refused when it tries to
      # rewrite a tag that already exists. Repairing an existing tag needs a
      # write-capable credential (an NPM_TOKEN secret); dist-tags.yml is where
      # that runs strictly.
      - name: Reconcile dist-tags
        continue-on-error: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/dist-tag.mjs reconcile
